<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Invoicing | WSU Veterinary Teaching Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214; --bg2:#16171a; --panel:#1b1c20; --panel2:#212227; --hover:#26282d;
  --line:#2b2d33; --line2:#363940;
  --text:#ebebe8; --text2:#b4b5b9; --muted:#7f8187;
  --crimson:#981e32; --crimson2:#b3243b; --crimson-text:#e2576d; --crimson-soft:rgba(152,30,50,.16);
  --ok:#5fb98a; --warn:#d7a14a; --warn-soft:rgba(215,161,74,.12);
  --r:8px; --r2:12px;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--crimson);color:#fff}
.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Top bar */
.top{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;border-radius:7px;background:var(--crimson);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.brand-t b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand-t span{font-size:11.5px;color:var(--muted)}
.top-sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:#454850}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.primary:hover{background:var(--crimson2);border-color:var(--crimson2)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.danger:hover{color:#ff8a9a;border-color:#6b2632;background:#2a1519}

/* Layout */
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 440px;height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 24px;background:var(--bg2)}
.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:10px 8px 6px}
.dept{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px;color:var(--text2);font-size:13px}
.dept:hover{background:var(--panel);color:var(--text)}
.dept.on{background:var(--crimson-soft);color:var(--text)}
.dept.on .bar{background:var(--crimson-text)}
.dept .bar{width:3px;height:16px;border-radius:2px;background:transparent;flex-shrink:0}
.dept .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dept .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dept .yr{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--muted)}
.dept .yr.cur{border-color:rgba(95,185,138,.35);color:var(--ok)}
.side-note{margin:16px 8px 0;font-size:11.5px;color:var(--muted);line-height:1.5}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.toolbar{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;padding:0 74px 0 38px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);outline:0;font-size:14.5px;transition:border-color .12s,box-shadow .12s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--crimson2);box-shadow:0 0 0 3px rgba(152,30,50,.25)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;background:var(--bg2)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{background:none;border:0;padding:4px 10px;border-radius:5px;font-size:12.5px;color:var(--text2)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);cursor:pointer;user-select:none}
.chk input{accent-color:var(--crimson2)}
.sel{height:30px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:0 8px;outline:0;font-size:12.5px;color:var(--text2)}
.sel option{background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text2)}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.6;margin-left:4px}
.meta-bar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.meta-bar b{color:var(--text);font-weight:600}

.list{flex:1;overflow-y:auto;padding:6px 10px 40px}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:16px 10px 6px;display:flex;gap:8px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:grid;grid-template-columns:86px minmax(0,1fr) auto 34px;align-items:center;gap:12px;padding:9px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel)}
.item.kb{border-color:var(--line2);background:var(--panel)}
.item.added{background:linear-gradient(90deg,rgba(152,30,50,.12),transparent 60%)}
.item .cd{font-family:var(--mono);font-size:11.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cd.none{color:#4c4e54}
.item .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm mark{background:rgba(226,87,109,.25);color:inherit;border-radius:2px}
.item .sub{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;margin-top:1px}
.item .sub .dot{opacity:.5}
.item .sub .nt{overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--line2);color:var(--text2);line-height:17px;white-space:nowrap}
.tag.old{border-color:rgba(215,161,74,.35);color:var(--warn)}
.tag.sup{border-color:rgba(215,161,74,.5);color:var(--warn);background:var(--warn-soft)}
.tag.edit{border-color:rgba(95,185,138,.4);color:var(--ok)}
.tag.cur{border-color:rgba(95,185,138,.35);color:var(--ok)}
.pr{font-family:var(--mono);font-size:13.5px;font-weight:500;text-align:right;white-space:nowrap}
.pr.nc{color:var(--ok);font-size:12px}
.pr.na{color:var(--warn);font-size:11.5px}
.pr .rg{font-size:12.5px}
.pr-edit{display:none}
.mobile-dept{display:none!important}
.add{width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;color:var(--text2)}
.add:hover{background:var(--crimson);border-color:var(--crimson);color:#fff}
.item.added .add{color:var(--crimson-text);border-color:rgba(226,87,109,.45)}
.item.added .add:hover{color:#fff}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* Invoice */
.inv{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg2);min-height:0}
.inv-h{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.inv-h h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.inv-h .cnt{font-family:var(--mono);font-size:11px;background:var(--crimson);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.inv-h .sp{flex:1}
.case{padding:10px 16px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:8px 8px}
.case .s3{grid-column:span 3}.case .s2{grid-column:span 2}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.inp{height:32px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 9px;outline:0;font-size:13px;width:100%}
.inp:focus{border-color:var(--crimson2)}
textarea.inp{height:auto;min-height:34px;padding:7px 9px;resize:vertical}
.lines{flex:1;overflow-y:auto;padding:6px 10px 16px;min-height:120px}
.lgrp{display:flex;justify-content:space-between;align-items:baseline;padding:12px 6px 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.lgrp span:last-child{font-family:var(--mono);letter-spacing:0;text-transform:none;font-size:11.5px;color:var(--text2)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel);margin-bottom:6px}
.ln .nm{font-size:13px;font-weight:500;line-height:1.3}
.ln .cd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
.ln .tot{font-family:var(--mono);font-size:13.5px;font-weight:600;text-align:right;white-space:nowrap}
.ln .ctl{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:6px;overflow:hidden;height:28px}
.qty button{width:26px;height:100%;background:var(--panel2);border:0;color:var(--text2);font-size:15px;line-height:1}
.qty button:hover{background:var(--hover);color:var(--text)}
.qty input{width:44px;height:100%;border:0;background:transparent;text-align:center;font-family:var(--mono);font-size:12.5px;outline:0}
.unit{display:inline-flex;align-items:center;height:28px;border:1px solid var(--line2);border-radius:6px;padding:0 6px;gap:3px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.unit input{width:76px;border:0;background:transparent;outline:0;font-family:var(--mono);font-size:12.5px;color:var(--text);text-align:right}
.unit.need{border-color:rgba(215,161,74,.55)}
.ln .rgsel{height:28px;font-size:12px}
.ln .x{margin-left:auto;width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.ln .x:hover{background:#2a1519;color:#ff8a9a}
.ln .warn{grid-column:1/-1;font-size:11.5px;color:var(--warn)}
.inv-empty{text-align:center;color:var(--muted);padding:44px 24px;font-size:13px;line-height:1.6}
.inv-empty b{color:var(--text);display:block;font-size:14px;margin-bottom:4px}
.custom{border-top:1px solid var(--line);padding:10px 16px}
.custom summary{font-size:12.5px;color:var(--text2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.custom summary::-webkit-details-marker{display:none}
.custom[open] summary{margin-bottom:8px}
.custom form{display:grid;grid-template-columns:1fr 92px auto;gap:6px}
.foot{border-top:1px solid var(--line);padding:12px 16px 14px;background:var(--bg2)}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);padding:3px 0}
.trow b{font-family:var(--mono);font-weight:500;color:var(--text)}
.trow .disc{display:flex;align-items:center;gap:6px}
.trow .disc input{width:56px;height:26px}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:1px solid var(--line2)}
.grand span{font-size:13px;font-weight:600;letter-spacing:.02em}
.grand b{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.range-note{font-size:11.5px;color:var(--muted);text-align:right;margin-top:2px}
.range-note b{font-family:var(--mono);color:var(--text2);font-weight:500}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.acts .btn{padding:0 6px;gap:5px}
.acts .btn{justify-content:center}

.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2e34;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:1360px){.app{grid-template-columns:228px minmax(0,1fr) 400px}}
.more{display:flex;justify-content:center;gap:8px;padding:14px 0 6px}
.more span{font-size:12px;color:var(--muted);align-self:center}
.mbar,.m-only,.inv-tog{display:none}
@media screen and (max-width:1060px){
  html,body{height:auto}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .top{height:46px;padding:0 14px}
  .mark{width:28px;height:28px;font-size:11px}
  .brand-t b{font-size:14px}.brand-t span{display:none}
  .app{display:block;height:auto}
  .side{display:none}
  .main{overflow:visible}
  .toolbar{position:sticky;top:0;z-index:20;padding:10px 12px 8px;gap:8px;background:rgba(17,18,20,.97);backdrop-filter:blur(8px)}
  .search input{height:44px;font-size:16px}
  .kbd,#hint{display:none!important}
  .row{flex-wrap:wrap;gap:8px}
  .row .top-sp{display:none}
  .mobile-dept{display:inline-flex!important;flex:1;min-width:0;height:34px}
  #sort{height:34px;width:auto;flex:0 0 auto}
  .seg{display:flex;order:3;flex:1 0 100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 0 auto;padding:6px 10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:5px 11px}
  .list{overflow:visible;padding:4px 8px 16px}
  .item{grid-template-columns:minmax(0,1fr) auto 38px;padding:11px 8px;gap:10px}
  .item .cd{display:none}
  .item .nm{white-space:normal;line-height:1.3}
  .add{width:36px;height:36px}
  .grp{padding:14px 8px 4px}
  /* invoice as its own screen */
  .inv{display:none;border-left:0;position:fixed;left:0;right:0;top:46px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;background:var(--bg2)}
  body.m-inv .inv{display:flex}
  body.m-inv .main{display:none}
  .inv-h{padding:10px 14px}
  .inv-tog{display:inline-flex}
  .case{display:none;padding:8px 14px 12px}
  body.m-case .case{display:grid}
  .lines{padding:4px 8px 12px}
  .days{padding:8px 10px}
  .foot{padding:10px 14px 12px}
  .grand b{font-size:22px}
  .acts{margin-top:10px}
  .acts .btn{height:38px}
  .custom{padding:8px 14px}
  .qty{height:34px}.qty button{width:34px}
  .unit{height:34px}
  .ln .x{width:34px;height:34px}
  /* bottom bar */
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line2);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
  .mbar .info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .mbar .info small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .info b{font-family:var(--mono);font-size:19px;font-weight:600}
  .mbar .btn{height:42px;padding:0 16px;font-size:14px}
  .mbar.bump{animation:bump .35s ease}
  @keyframes bump{0%{background:var(--panel)}30%{background:#3a1a21}100%{background:var(--panel)}}
  .toast{bottom:auto;top:54px;transform:translate(-50%,-10px)}
  .toast.on{transform:translate(-50%,0)}
}
@media screen and (max-width:420px){
  .mbar .btn{padding:0 12px}
}

/* Print */
#print{display:none}
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff;color:#111;font-size:11pt}
  .top,.app,.scrim,.toast,.mbar{display:none!important}
  body{padding:0!important}
  #print{display:block}
  .p-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #981e32;padding-bottom:10px;margin-bottom:14px}
  .p-h h1{font-size:17pt;font-weight:700;letter-spacing:-.01em}
  .p-h .s{font-size:9.5pt;color:#555}
  .p-h .r{text-align:right;font-size:9.5pt;color:#333}
  .p-case{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;font-size:10pt;margin-bottom:14px}
  .p-case div span{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.08em;color:#777}
  .p-t{width:100%;border-collapse:collapse;font-size:9.5pt}
  .p-t th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.08em;color:#666;border-bottom:1px solid #999;padding:5px 4px}
  .p-t td{padding:5px 4px;border-bottom:1px solid #e3e3e3;vertical-align:top}
  .p-t td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
  .p-t th.n{text-align:right}
  .p-t tr.g td{font-weight:600;background:#f4f4f4;font-size:8.5pt;text-transform:uppercase;letter-spacing:.06em;color:#444}
  .p-tot{margin-left:auto;width:280px;margin-top:12px;font-size:10pt}
  .p-tot div{display:flex;justify-content:space-between;padding:3px 0}
  .p-tot .gt{border-top:2px solid #111;margin-top:4px;padding-top:6px;font-weight:700;font-size:13pt}
  .p-tot span:last-child{font-family:var(--mono)}
  .p-notes{margin-top:16px;font-size:9.5pt;border:1px solid #ddd;padding:8px 10px;border-radius:4px}
  .p-foot{margin-top:40px;display:flex;justify-content:space-between;font-size:9.5pt;color:#333}
  .p-foot div{border-top:1px solid #777;padding-top:4px;width:44%}
  .p-disc{margin-top:18px;font-size:8pt;color:#777}
}

/* Day tabs */
.days{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.days-scroll{display:flex;align-items:center;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.days-scroll::-webkit-scrollbar{display:none}
.day{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text2);font-size:12.5px;font-weight:500;white-space:nowrap}
.day:hover{background:var(--panel);color:var(--text)}
.day.on{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.day .amt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day.on .amt{color:var(--text2)}
.day.full{flex-shrink:0;border-color:var(--line2)}
.day.full.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.day.full.on .amt{color:rgba(255,255,255,.8)}
.day-add{width:30px;height:30px;border-radius:6px;border:1px dashed var(--line2);background:transparent;color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.day-add:hover{color:var(--text);border-color:#4a4d55}
.day-bar{display:flex;align-items:center;gap:8px;padding:10px 16px 2px}
.day-bar .lbl{font-size:12px;color:var(--muted)}
.day-bar input{height:28px;width:140px}
.day-bar .sp{flex:1}
.fday{margin:10px 6px 4px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fday-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--panel);cursor:pointer}
.fday-h:hover{background:var(--panel2)}
.fday-h b{font-size:13px;font-weight:600}
.fday-h small{font-size:11.5px;color:var(--muted);margin-left:8px}
.fday-h .m{font-family:var(--mono);font-size:13px;font-weight:600}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:6px 12px;border-top:1px solid var(--line);font-size:12.5px;align-items:baseline}
.frow .q{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.frow .m{font-family:var(--mono);white-space:nowrap}
.frow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow.empty-day{color:var(--muted);font-style:italic;grid-template-columns:1fr}
</style>
</head>

<header class="top">
  <div class="brand">
    <div class="mark">DC</div>
    <div class="brand-t"><b>Diagnostic Challenge Invoicing</b><span>WSU Veterinary Teaching Hospital</span></div>
  </div>
</header>

        <button class="btn icon ghost sm clr" id="clr" title="Clear"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

      <div class="row">
        <select class="sel mobile-dept" id="deptMobile"></select>
        <div class="seg" id="species"></div>
        <div class="top-sp"></div>
        <select class="sel" id="sort">

          <option value="lo">Sort: price low-high</option>
          <option value="hi">Sort: price high-low</option>

      </div>
      <div class="chips" id="cats"></div>
      <div class="meta-bar"><span id="count"></span><span id="hint">Enter adds the highlighted item to the selected day.</span></div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <aside class="inv">
    <div class="inv-h">
      <h2>Case invoice</h2><span class="cnt" id="lineCount">0</span>
      <div class="sp"></div>
      <button class="btn ghost sm inv-tog" id="caseTog">Case details</button>
      <button class="btn ghost sm danger" id="newCaseBtn" title="Clear every day and start a new case">New case</button>
    </div>
    <div class="case">
      <div class="fld s3"><label for="f_case">Case / patient</label><input class="inp" id="f_case" placeholder="DC Case 3 / Biscuit"></div>
      <div class="fld s3"><label for="f_team">Team / clinician</label><input class="inp" id="f_team" placeholder="Team B"></div>
      <div class="fld s3"><label for="f_sig">Signalment</label><input class="inp" id="f_sig" placeholder="7y MN Lab, 32 kg"></div>
      <div class="fld s3"><label for="f_budget">Client budget</label><input class="inp" id="f_budget" inputmode="decimal" placeholder="Optional"></div>
    </div>
    <div class="days" id="days"></div>
    <div class="lines" id="lines"></div>
    <details class="custom" id="customBox">
      <summary><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="customLbl">Add a custom line item</span></summary>
      <form id="customForm">
        <input class="inp" id="c_name" placeholder="Description" required>
        <input class="inp mono" id="c_price" type="number" step="0.01" min="0" placeholder="0.00" required>
        <button class="btn primary sm" type="submit" style="height:32px">Add</button>
      </form>
    </details>
    <div class="foot">
      <div class="trow" id="dayRow"><span id="dayRowLbl">This day</span><b id="t_day">$0.00</b></div>
      <div class="trow"><span>Case subtotal</span><b id="t_sub">$0.00</b></div>
      <div class="trow"><span class="disc">Discount
        <select class="sel" id="discSel" style="height:26px"><option value="0">None</option><option value="10">10%</option><option value="20">20%</option><option value="custom">Custom %</option></select>
        <input class="inp mono" id="discCustom" type="number" min="0" max="100" step="0.5" style="display:none"></span><b id="t_disc">-$0.00</b></div>
      <div class="trow" id="budgetRow" style="display:none"><span>Remaining vs. budget</span><b id="t_budget"></b></div>
      <div class="grand"><span>Case total</span><b id="t_total">$0.00</b></div>
      <div class="range-note" id="rangeNote"></div>
      <div class="acts">
        <button class="btn" id="copyBtn"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>Copy</button>
        <button class="btn" id="csvBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>CSV</button>
        <button class="btn" id="pdfBtn"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"/></svg>PDF</button>
        <button class="btn primary" id="printBtn"><svg class="i" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v6H7z"/></svg>Print</button>
      </div>
    </div>
  </aside>
</div>

<div class="mbar" id="mbar">

</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const KEY = 'dcInvoicing.v3';
const SPECIES = ['All','Small Animal','Equine','Food Animal','Avian & Exotic'];
const money = v => (v<0?'-':'') + '$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- storage ---------- */
function blankCase(){ const d = {id:uid(), date:today(), lines:[]}; return {f:{case:'', team:'', sig:'', budget:''}, days:[d], active:d.id, disc:'0', discCustom:''}; }
let C = null;
try{ const r = localStorage.getItem(KEY); if(r) C = JSON.parse(r); }catch(e){}
if(!C || !Array.isArray(C.days) || !C.days.length) C = blankCase();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(C)); }catch(e){} }

/* ---------- catalog ---------- */
let SHEETS = [], ITEMS = [], BYID = {};
(function buildCatalog(){
  SHEETS = BUILTIN.sheets.map(s => Object.assign({}, s));
  ITEMS = BUILTIN.items.map(it => Object.assign({}, it));
  const sheetBy = {}; SHEETS.forEach(s => sheetBy[s.dept] = s);
  ITEMS.forEach((it, i) => {
    const sh = sheetBy[it.d];
    it.rank = sh.rank; it.date = sh.date; it.ord = i;
    if(it.lo != null && it.hi == null) it.hi = it.lo;
    it.hay = (it.c+' '+it.n+' '+it.d+' '+it.g+' '+(it.t||'')+' '+it.s).toLowerCase();
  });
  // newest sheet wins when the same billing code and species appear on more than one sheet
  const groups = {};
  ITEMS.forEach(it => { if(it.c) (groups[it.c.toLowerCase()+'|'+it.s] ||= []).push(it); });
  Object.values(groups).forEach(g => {
    if(g.length < 2) return;
    const best = Math.max(...g.map(x => x.rank));
    g.forEach(x => { if(x.rank < best) x.x = true; });
  });
  ITEMS = ITEMS.filter(it => !it.x);
  BYID = {}; ITEMS.forEach(it => BYID[it.id] = it);
  SHEETS.forEach(s => s.count = ITEMS.filter(i => i.d === s.dept).length);
  SHEETS.sort((a,b) => b.rank - a.rank || a.dept.localeCompare(b.dept));
})();
const isCurrent = s => s.rank >= 2026;
const yearLabel = d => { const m = String(d).match(/\d{4}/); return m ? m[0] : 'n.d.'; };

/* ---------- view state ---------- */
const view = {dept:'all', species:'All', cat:'all', q:'', sort:'rel', kb:0, page:1};
const PAGE = () => window.matchMedia('(max-width:1060px)').matches ? 25 : 50;

/* ---------- sidebar ---------- */
function renderSide(){
  const cnt = d => ITEMS.filter(i => (d==='all' || i.d===d) && (view.species==='All' || i.s===view.species)).length;
  const btn = (key, label, s) => `<button class="dept ${view.dept===key?'on':''}" data-dept="${esc(key)}"><span class="bar"></span><span class="nm">${esc(label)}</span>${s?`<span class="yr ${isCurrent(s)?'cur':''}" title="${esc(s.title)} (${esc(s.date)})">${yearLabel(s.date)}</span>`:''}<span class="ct">${cnt(key)}</span></button>`;
  const curS = SHEETS.filter(isCurrent), old = SHEETS.filter(s => !isCurrent(s));
  $('#side').innerHTML = btn('all','All departments') +
    `<h4>Current sheets (2026)</h4>` + curS.map(s => btn(s.dept, s.dept, s)).join('') +
    `<h4>Older sheets</h4>` + old.map(s => btn(s.dept, s.dept, s)).join('') +
    `<p class="side-note">Older sheets are the newest versions available for those services. When a 2026 sheet lists the same billing code, only the 2026 price is shown.</p>`;
  $('#deptMobile').innerHTML = `<option value="all">All departments</option>` + SHEETS.map(s => `<option value="${esc(s.dept)}" ${view.dept===s.dept?'selected':''}>${esc(s.dept)} (${yearLabel(s.date)})</option>`).join('');
}
$('#side').addEventListener('click', e => { const b = e.target.closest('.dept'); if(!b) return; view.dept = b.dataset.dept; view.cat='all'; view.page=1; view.kb=0; renderSide(); renderList(); });
$('#deptMobile').addEventListener('change', e => { view.dept = e.target.value; view.cat='all'; view.page=1; renderSide(); renderList(); window.scrollTo(0,0); });

$('#species').innerHTML = SPECIES.map(s => `<button data-sp="${s}" class="${s===view.species?'on':''}">${s}</button>`).join('');
$('#species').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; view.species = b.dataset.sp; view.cat='all'; view.page=1; $$('#species button').forEach(x => x.classList.toggle('on', x===b)); renderSide(); renderList(); });
$('#sort').addEventListener('change', e => { view.sort = e.target.value; view.page=1; renderList(); });

/* ---------- list ---------- */
let visible = [];
function filtered(ignoreCat){
  const toks = view.q.toLowerCase().split(/\s+/).filter(Boolean);
  return ITEMS.filter(it =>
    (view.dept==='all' || it.d===view.dept) &&
    (view.species==='All' || it.s===view.species) &&
    (ignoreCat || view.cat==='all' || it.g===view.cat) &&
    toks.every(t => it.hay.includes(t))
  );
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function score(it, toks){
  let s = 0, tl = 0; const n = it.n.toLowerCase(), c = it.c.toLowerCase();
  toks.forEach(t => { tl += t.length; if(c===t) s+=50; else if(c.startsWith(t)) s+=20; if(n.startsWith(t)) s+=3; if(new RegExp('\\b'+reEsc(t)).test(n)) s+=6; });
  s += 10*Math.min(1, tl/Math.max(1,n.length)); if(it.c) s+=4;
  s += (it.rank-2000)/5; if(it.lo==null) s-=3; return s;
}
function hl(text, toks){
  let h = esc(text);
  toks.forEach(t => { if(t.length<2) return; h = h.replace(new RegExp('('+reEsc(esc(t))+')','ig'),'<mark>$1</mark>'); });
  return h;
}
function priceHTML(it){
  if(it.lo == null) return `<div class="pr na">Not listed</div>`;
  if(it.hi !== it.lo) return `<div class="pr"><span class="rg">${money(it.lo).replace('.00','')} - ${money(it.hi).replace('.00','')}</span></div>`;
  if(it.lo === 0) return `<div class="pr nc">No charge</div>`;
  return `<div class="pr">${money(it.lo)}</div>`;
}
function renderCats(){
  const base = filtered(true);
  const cats = {}; base.forEach(i => cats[i.g] = (cats[i.g]||0)+1);
  const keys = Object.keys(cats);
  if(view.dept==='all' && !view.q){ $('#cats').innerHTML=''; $('#cats').style.display='none'; return; }
  $('#cats').style.display = keys.length>1 ? 'flex' : 'none';
  $('#cats').innerHTML = `<button class="chip ${view.cat==='all'?'on':''}" data-cat="all">All<span class="n">${base.length}</span></button>` +
    keys.map(k => `<button class="chip ${view.cat===k?'on':''}" data-cat="${esc(k)}">${esc(k)}<span class="n">${cats[k]}</span></button>`).join('');
}
$('#cats').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; view.cat = b.dataset.cat; view.page=1; view.kb=0; renderList(); });

function renderList(){
  renderCats();
  const toks = view.q.toLowerCase().split(/\s+/).filter(Boolean);
  let rows = filtered(false);
  if(view.sort==='name') rows.sort((a,b) => a.n.localeCompare(b.n));
  else if(view.sort==='lo') rows.sort((a,b) => (a.lo??1e9) - (b.lo??1e9));
  else if(view.sort==='hi') rows.sort((a,b) => (b.hi??-1) - (a.hi??-1));
  else if(toks.length) rows.sort((a,b) => score(b,toks) - score(a,toks) || a.ord-b.ord);
  visible = rows;
  if(view.kb >= rows.length) view.kb = Math.max(0, rows.length-1);
  const inDay = new Set(targetDay().lines.map(l => l.ref));
  $('#count').innerHTML = `<b>${rows.length.toLocaleString()}</b> ${rows.length===1?'item':'items'}${view.dept!=='all'?' in '+esc(view.dept):''}`;
  if(!rows.length){ $('#list').innerHTML = `<div class="empty"><b>No matches</b>Try a shorter search or another species. You can also add a custom line item.</div>`; return; }
  const grouped = !toks.length && view.sort==='rel';
  let html = '', last = null;
  const LIMIT = PAGE()*view.page;
  rows.slice(0, LIMIT).forEach((it, idx) => {
    const key = (view.dept==='all' ? it.d+' / ' : '') + it.g;
    if(grouped && key!==last){ html += `<div class="grp">${esc(key)}</div>`; last = key; }
    const sh = SHEETS.find(s => s.dept===it.d);
    html += `<div class="item ${inDay.has(it.id)?'added':''} ${idx===view.kb&&toks.length?'kb':''}" data-id="${it.id}">
      <div class="cd ${it.c?'':'none'}">${it.c?hl(it.c,toks):'no code'}</div>
      <div style="min-width:0"><div class="nm">${hl(it.n,toks)}</div>
        <div class="sub"><span class="tag ${isCurrent(sh)?'cur':'old'}" title="${esc(sh.title)}">${esc(sh.short)} ${yearLabel(it.date)}</span>${view.dept==='all'||toks.length?`<span>${esc(it.d)}</span><span class="dot">/</span>`:''}<span>${esc(it.g)}</span>${it.s!=='Small Animal'?`<span class="dot">/</span><span>${esc(it.s)}</span>`:''}${it.t?`<span class="dot">/</span><span class="nt" title="${esc(it.t)}">${esc(it.t)}</span>`:''}</div></div>
      ${priceHTML(it)}
      <button class="add" title="Add to ${esc(dayName(targetDay()))}"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>`;
  });
  if(rows.length > LIMIT) html += `<div class="more"><span>${LIMIT} of ${rows.length.toLocaleString()}</span><button class="btn sm" data-more>Show ${Math.min(PAGE(), rows.length-LIMIT)} more</button></div><p class="side-note" style="text-align:center;margin:0 0 10px">Search or pick a department to narrow the list.</p>`;
  $('#list').innerHTML = html;
}
$('#list').addEventListener('click', e => { if(e.target.closest('[data-more]')){ view.page++; renderList(); return; } const it = e.target.closest('.item'); if(it) addItem(it.dataset.id); });

/* search */
const q = $('#q');
q.addEventListener('input', () => { view.q = q.value.trim(); view.kb = 0; view.cat='all'; view.page=1; $('#clr').style.display = view.q?'inline-flex':'none'; $('#kbd').style.display = view.q?'none':'block'; renderList(); $('#list').scrollTop = 0; });
$('#clr').addEventListener('click', () => { q.value=''; q.dispatchEvent(new Event('input')); q.focus(); });
q.addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); view.kb = Math.min(visible.length-1, view.kb+1); renderList(); scrollKb(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); view.kb = Math.max(0, view.kb-1); renderList(); scrollKb(); }
  else if(e.key==='Enter'){ if(visible[view.kb]) addItem(visible[view.kb].id); }
  else if(e.key==='Escape'){ if(q.value){ q.value=''; q.dispatchEvent(new Event('input')); } else q.blur(); }
});
function scrollKb(){ const el = $('.item.kb'); if(el) el.scrollIntoView({block:'nearest'}); }
window.addEventListener('keydown', e => {
  if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); q.focus(); q.select(); }
});

/* ---------- days ---------- */
const isFull = () => C.active === 'full';
const dayIndex = d => C.days.indexOf(d);
const dayName = d => 'Day ' + (dayIndex(d)+1);
// items always go to the selected day; from the full-case view they go to the last day
const targetDay = () => C.days.find(d => d.id===C.active) || C.days[C.days.length-1];
function renderDays(){
  $('#days').innerHTML = '<div class="days-scroll">' + C.days.map(d => `<button class="day ${C.active===d.id?'on':''}" data-day="${d.id}">${dayName(d)}<span class="amt">${money(dayTotal(d)).replace('.00','')}</span></button>`).join('') +
    `<button class="day-add" id="addDay" title="Add a day"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>` +
    `<button class="day full ${isFull()?'on':''}" data-day="full">Full case<span class="amt">${money(totals().total).replace('.00','')}</span></button>`;
}
$('#days').addEventListener('click', e => {
  if(e.target.closest('#addDay')){
    const d = {id:uid(), date:'', lines:[]}; C.days.push(d); C.active = d.id;
    save(); renderInvoice(); renderList(); toast(dayName(d)+' added'); return;
  }
  const b = e.target.closest('[data-day]'); if(!b) return;
  C.active = b.dataset.day; save(); renderInvoice(); renderList();
});

/* ---------- invoice ---------- */
function linePrice(l){
  if(l.price != null) return l.price;
  const it = BYID[l.ref];
  if(!it || it.lo==null) return 0;
  if(it.hi !== it.lo) return l.pick==='hi' ? it.hi : l.pick==='mid' ? (it.lo+it.hi)/2 : it.lo;
  return it.lo;
}
const dayTotal = d => d.lines.reduce((a,l) => a + linePrice(l)*l.qty, 0);
function addItem(id){
  const it = BYID[id]; if(!it) return;
  const wasFull = isFull();
  const d = targetDay();
  if(wasFull) C.active = d.id;
  const ex = d.lines.find(l => l.ref===id && l.price==null);
  if(ex) ex.qty = +(ex.qty+1).toFixed(2);
  else d.lines.push({k:uid(), ref:id, qty:1, pick:'lo', price:null});
  save(); renderInvoice(); renderList(); bump();
  toast(`Added to ${dayName(d)}: ${it.n}` + (it.lo==null ? '. No price on the sheet, enter one on the invoice.' : ''));
}
$('#customForm').addEventListener('submit', e => {
  e.preventDefault();
  const n = $('#c_name').value.trim(), p = parseFloat($('#c_price').value);
  if(!n || isNaN(p)) return;
  const d = targetDay(); if(isFull()) C.active = d.id;
  d.lines.push({k:uid(), ref:null, custom:n, qty:1, price:Math.round(p*100)/100});
  $('#c_name').value=''; $('#c_price').value='';
  save(); renderInvoice(); toast('Custom item added to '+dayName(d));
});
function lineInfo(l){
  const it = l.ref ? BYID[l.ref] : null;
  return {name: it ? it.n : (l.custom || 'Removed item'), code: it ? it.c : 'CUSTOM', dept: it ? it.d : 'Custom items', it};
}
function totals(){
  let sub = 0, lo = 0, hi = 0, ranged = false, missing = 0;
  C.days.forEach(d => d.lines.forEach(l => {
    const p = linePrice(l), it = l.ref ? BYID[l.ref] : null;
    sub += p*l.qty;
    if(it && it.lo!=null && it.hi!==it.lo && l.price==null){ ranged = true; lo += it.lo*l.qty; hi += it.hi*l.qty; }
    else { lo += p*l.qty; hi += p*l.qty; }
    if(it && it.lo==null && l.price==null) missing++;
  }));
  let pct = C.disc==='custom' ? (parseFloat(C.discCustom)||0) : +C.disc;
  pct = Math.min(100, Math.max(0, pct));
  const d = sub*pct/100;
  return {sub, pct, disc:d, total:sub-d, ranged, lo:lo*(1-pct/100), hi:hi*(1-pct/100), missing};
}
function lineCard(l){
  const {name, code, it} = lineInfo(l);
  const p = linePrice(l), ranged = it && it.lo!=null && it.hi!==it.lo;
  const need = it && it.lo==null && l.price==null;
  const sh = it ? SHEETS.find(s => s.dept===it.d) : null;
  return `<div class="ln" data-k="${l.k}">
    <div><div class="nm">${esc(name)}</div><div class="cd">${esc(code||'no code')}${sh?' / '+esc(sh.short)+' '+yearLabel(it.date):''}</div></div>
    <div class="tot">${money(p*l.qty)}</div>
    <div class="ctl">
      <div class="qty"><button data-q="-1" title="Decrease">&minus;</button><input data-qi value="${l.qty}" inputmode="decimal"><button data-q="1" title="Increase">+</button></div>
      ${ranged && l.price==null ? `<select class="sel rgsel" data-pick><option value="lo" ${l.pick==='lo'?'selected':''}>Low ${money(it.lo)}</option><option value="mid" ${l.pick==='mid'?'selected':''}>Mid ${money((it.lo+it.hi)/2)}</option><option value="hi" ${l.pick==='hi'?'selected':''}>High ${money(it.hi)}</option></select>` :
        `<label class="unit ${need?'need':''}" title="Unit price">$<input data-up value="${l.price!=null?l.price:(it&&it.lo!=null?it.lo:'')}" placeholder="0.00" inputmode="decimal"></label><span style="font-size:11.5px;color:var(--muted)">each</span>`}
      ${l.price!=null && it ? `<button class="btn sm ghost" data-reset title="Use sheet price">Reset</button>` : ''}
      ${ranged && l.price==null ? `<button class="btn sm ghost" data-fix title="Enter an exact price">Exact</button>` : ''}
      <button class="x" data-rm title="Remove"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    ${need?'<div class="warn">No price on the sheet. Enter the price your instructor gave you.</div>':''}
  </div>`;
}
function renderInvoice(){
  ['case','team','sig','budget'].forEach(k => { const el = $('#f_'+k); if(document.activeElement!==el) el.value = C.f[k]||''; });
  $('#discSel').value = C.disc; $('#discCustom').style.display = C.disc==='custom'?'inline-block':'none'; $('#discCustom').value = C.discCustom||'';
  const n = C.days.reduce((a,d) => a + d.lines.reduce((b,l) => b + (+l.qty||0), 0), 0);
  $('#lineCount').textContent = Number.isInteger(n) ? n : n.toFixed(1);
  renderDays();
  const on = $('#days .day.on:not(.full)'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'});
  if(isFull()){
    $('#customLbl').textContent = `Add a custom line item to ${dayName(targetDay())}`;
    $('#lines').innerHTML = C.days.map(d => `<div class="fday"><div class="fday-h" data-goto="${d.id}"><div><b>${dayName(d)}</b><small>${esc(d.date||'')}</small></div><span class="m">${money(dayTotal(d))}</span></div>` +
      (d.lines.length ? d.lines.map(l => { const {name} = lineInfo(l); const p = linePrice(l); return `<div class="frow"><span class="n" title="${esc(name)}">${esc(name)}</span><span class="q">${l.qty} x ${money(p)}</span><span class="m">${money(p*l.qty)}</span></div>`; }).join('')
      : `<div class="frow empty-day">No items</div>`) + `</div>`).join('');
  } else {
    const d = targetDay(), i = dayIndex(d);
    $('#customLbl').textContent = `Add a custom line item to ${dayName(d)}`;
    let html = `<div class="day-bar"><span class="lbl">${dayName(d)} date</span><input class="inp" id="dayDate" value="${esc(d.date||'')}" placeholder="e.g. ${esc(today())}"><span class="sp"></span>${C.days.length>1?`<button class="btn sm ghost danger" id="delDay">Remove ${dayName(d)}</button>`:''}</div>`;
    if(!d.lines.length){
      html += `<div class="inv-empty"><b>Nothing on ${dayName(d)} yet</b>Click an item in the catalog, or search and press Enter. Use + above to start the next day, and Full case to see and print the whole stay.</div>`;
    } else {
      const groups = {}, order = [];
      d.lines.forEach(l => { const g = lineInfo(l).dept; if(!groups[g]){ groups[g]=[]; order.push(g); } groups[g].push(l); });
      html += order.map(g => `<div class="lgrp"><span>${esc(g)}</span><span>${money(groups[g].reduce((a,l) => a + linePrice(l)*l.qty, 0))}</span></div>` + groups[g].map(lineCard).join('')).join('');
    }
    $('#lines').innerHTML = html;
  }
  renderTotals();
}
function renderTotals(){
  const t = totals();
  renderMbar();
  if(isFull()) $('#dayRow').style.display = 'none';
  else { const d = targetDay(); $('#dayRow').style.display = 'flex'; $('#dayRowLbl').textContent = dayName(d)+' total'; $('#t_day').textContent = money(dayTotal(d)); }
  $('#t_sub').textContent = money(t.sub);
  $('#t_disc').textContent = t.disc>0 ? '-'+money(t.disc)+` (${t.pct}%)` : '-$0.00';
  $('#t_total').textContent = money(t.total);
  const notes = [];
  if(t.ranged) notes.push(`Estimate range <b>${money(t.lo)} - ${money(t.hi)}</b>`);
  if(t.missing) notes.push(`<span style="color:var(--warn)">${t.missing} item${t.missing>1?'s need':' needs'} a price</span>`);
  $('#rangeNote').innerHTML = notes.join(' &middot; ');
  const b = parseFloat(String(C.f.budget||'').replace(/[$,]/g,''));
  if(!isNaN(b) && b>0){ const r = b - t.total; $('#budgetRow').style.display='flex'; $('#t_budget').textContent = money(r); $('#t_budget').style.color = r<0 ? 'var(--crimson-text)' : 'var(--ok)'; }
  else $('#budgetRow').style.display='none';
  $$('#days [data-day]').forEach(b => { const a = b.querySelector('.amt'); if(!a) return; a.textContent = money(b.dataset.day==='full' ? t.total : dayTotal(C.days.find(d => d.id===b.dataset.day))).replace('.00',''); });
}
function findLine(k){ for(const d of C.days){ const l = d.lines.find(x => x.k===k); if(l) return [d,l]; } return [null,null]; }
$('#lines').addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if(g){ C.active = g.dataset.goto; save(); renderInvoice(); renderList(); return; }
  if(e.target.closest('#delDay')){
    const d = targetDay(); if(d.lines.length && !confirm(`Remove ${dayName(d)} and its ${d.lines.length} item(s)?`)) return;
    const i = dayIndex(d); C.days.splice(i,1); C.active = C.days[Math.max(0,i-1)].id; save(); renderInvoice(); renderList(); return;
  }
  const ln = e.target.closest('.ln'); if(!ln) return;
  const [d, l] = findLine(ln.dataset.k); if(!l) return;
  const qb = e.target.closest('[data-q]');
  if(qb){ l.qty = Math.max(0, +(l.qty + +qb.dataset.q).toFixed(2)); if(l.qty===0) d.lines = d.lines.filter(x => x!==l); }
  else if(e.target.closest('[data-rm]')) d.lines = d.lines.filter(x => x!==l);
  else if(e.target.closest('[data-reset]')) l.price = null;
  else if(e.target.closest('[data-fix]')) l.price = Math.round(linePrice(l)*100)/100;
  else return;
  save(); renderInvoice(); renderList();
});
$('#lines').addEventListener('input', e => { if(e.target.id==='dayDate'){ targetDay().date = e.target.value; save(); } });
$('#lines').addEventListener('change', e => {
  const ln = e.target.closest('.ln'); if(!ln) return;
  const [, l] = findLine(ln.dataset.k); if(!l) return;
  if(e.target.matches('[data-pick]')) l.pick = e.target.value;
  else if(e.target.matches('[data-qi]')){ const v = parseFloat(e.target.value); l.qty = isNaN(v)||v<0 ? 1 : Math.round(v*100)/100; }
  else if(e.target.matches('[data-up]')){
    const v = parseFloat(String(e.target.value).replace(/[$,]/g,'')), it = l.ref ? BYID[l.ref] : null;
    if(isNaN(v)) l.price = l.ref ? null : 0;
    else if(it && it.lo!=null && it.hi===it.lo && v===it.lo) l.price = null;
    else l.price = Math.round(v*100)/100;
  }
  save(); renderInvoice();
});
$('#lines').addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('input')) e.target.blur(); });
['case','team','sig','budget'].forEach(k => $('#f_'+k).addEventListener('input', e => { C.f[k] = e.target.value; save(); if(k==='budget') renderTotals(); }));
$('#discSel').addEventListener('change', e => { C.disc = e.target.value; save(); renderInvoice(); });
$('#discCustom').addEventListener('input', e => { C.discCustom = e.target.value; save(); renderTotals(); });
$('#newCaseBtn').addEventListener('click', () => {
  if(!confirm('Start a new case? This clears the patient details and every day of the current invoice.')) return;
  C = blankCase(); save(); renderInvoice(); renderList(); toast('New case started');
});

/* ---------- export (always the whole case) ---------- */
function summaryText(){
  const t = totals(), L = [];
  L.push('WSU VTH | DIAGNOSTIC CHALLENGE INVOICE');
  L.push('Case: '+(C.f.case||'-')+'   Team: '+(C.f.team||'-'));
  if(C.f.sig) L.push('Signalment: '+C.f.sig);
  C.days.forEach(d => {
    L.push(''); L.push(`${dayName(d).toUpperCase()}${d.date?' ('+d.date+')':''}  ${money(dayTotal(d))}`);
    if(!d.lines.length) L.push('  No items');
    d.lines.forEach(l => { const {name, code} = lineInfo(l); const p = linePrice(l); L.push(`  ${code?'['+code+'] ':''}${name}  ${l.qty} x ${money(p)} = ${money(p*l.qty)}`); });
  });
  L.push('');
  L.push('Subtotal: '+money(t.sub));
  if(t.disc>0) L.push(`Discount (${t.pct}%): -`+money(t.disc));
  L.push('CASE TOTAL: '+money(t.total));
  if(t.ranged) L.push('Estimate range: '+money(t.lo)+' - '+money(t.hi));
  return L.join('\n');
}
const hasLines = () => C.days.some(d => d.lines.length);
$('#copyBtn').addEventListener('click', () => {

  const txt = summaryText();
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Case summary copied'), () => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Case summary copied'); }catch(e){ toast('Copy failed'); } ta.remove();
  });
});
const csvCell = v => { const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
function download(name, text){
  const blob = new Blob([text], {type:'text/csv'}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('#csvBtn').addEventListener('click', () => {
  if(!hasLines()) return toast('Add items first');

  C.days.forEach(d => d.lines.forEach(l => { const {name, code, dept} = lineInfo(l); const p = linePrice(l); rows.push([dayName(d), d.date||'', dept, code, name, l.qty, p.toFixed(2), (p*l.qty).toFixed(2)]); }));

});

const HW = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584], BW = [278, 333, 474, 556, 556, 889, 722, 238, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 333, 333, 584, 584, 584, 611, 975, 722, 722, 722, 722, 667, 611, 778, 722, 278, 556, 722, 611, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 333, 278, 333, 584, 556, 333, 556, 611, 556, 611, 556, 333, 611, 611, 278, 278, 556, 278, 889, 611, 611, 611, 611, 389, 556, 333, 611, 556, 778, 556, 556, 500, 389, 280, 389, 584];
const pdfTxt = s => String(s==null?'':s).replace(/[–—]/g,'-').replace(/[·•]/g,'-').replace(/×/g,'x').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7e]/g,'');
const tw = (s, size, bold) => { const W = bold?BW:HW; let w = 0; for(const ch of pdfTxt(s)) w += W[ch.charCodeAt(0)-32] || 556; return w*size/1000; };
function wrap(s, size, bold, max){
  const words = pdfTxt(s).split(' '), out = []; let line = '';
  words.forEach(w => { const t = line ? line+' '+w : w; if(tw(t,size,bold) <= max || !line) line = t; else { out.push(line); line = w; } });
  if(line) out.push(line); return out;
}
function buildPDF(){
  const t = totals(), pages = []; let ops = [], y = 0;
  const W = 612, H = 792, L = 48, R = 564;
  const esc = s => pdfTxt(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const text = (s, x, yy, size, bold, rgb, align) => {
    if(align==='r') x -= tw(s,size,bold);
    ops.push(`BT ${rgb||'0.07 0.07 0.07'} rg /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${yy.toFixed(2)} Td (${esc(s)}) Tj ET`);
  };
  const line = (x1, y1, x2, y2, w, rgb) => ops.push(`${rgb||'0.8 0.8 0.8'} RG ${w} w ${x1} ${y1.toFixed(2)} m ${x2} ${y2.toFixed(2)} l S`);
  const rect = (x, yy, w, h, rgb) => ops.push(`${rgb} rg ${x} ${yy.toFixed(2)} ${w} ${h} re f`);
  const COL = {code:L, item:L+62, qty:400, unit:482, tot:R};
  const head = () => {
    text('CODE', COL.code, y, 7, true, '0.45 0.45 0.45'); text('ITEM', COL.item, y, 7, true, '0.45 0.45 0.45');
    text('QTY', COL.qty, y, 7, true, '0.45 0.45 0.45', 'r'); text('UNIT', COL.unit, y, 7, true, '0.45 0.45 0.45', 'r'); text('TOTAL', COL.tot, y, 7, true, '0.45 0.45 0.45', 'r');
    y -= 6; line(L, y, R, y, 0.8, '0.55 0.55 0.55'); y -= 14;
  };
  const newPage = first => {
    if(ops.length) pages.push(ops.join('\n'));
    ops = []; y = H - 52;
    if(!first){ text((C.f.case||'Diagnostic Challenge Invoice')+' (continued)', L, y, 9, true); y -= 22; head(); }
  };
  const need = h => { if(y - h < 70) newPage(false); };
  newPage(true);
  // header
  text('Diagnostic Challenge Invoice', L, y, 18, true);
  const dates = C.days.map(d => d.date).filter(Boolean);
  text(C.days.length+' day'+(C.days.length>1?'s':''), R, y+4, 9, false, '0.3 0.3 0.3', 'r');
  if(dates.length) text(dates[0]+(dates.length>1?' - '+dates[dates.length-1]:''), R, y-8, 9, false, '0.3 0.3 0.3', 'r');
  y -= 15; text('Washington State University Veterinary Teaching Hospital', L, y, 9.5, false, '0.35 0.35 0.35');
  y -= 10; line(L, y, R, y, 1.6, '0.596 0.118 0.196'); y -= 20;
  [['CASE / PATIENT', C.f.case], ['TEAM / CLINICIAN', C.f.team], ['SIGNALMENT', C.f.sig]].forEach(([k, v], i) => {
    const x = L + i*172; text(k, x, y, 7, true, '0.45 0.45 0.45'); wrap(v||'-', 10, false, 162).slice(0,2).forEach((s, j) => text(s, x, y-13-j*12, 10, false));
  });
  y -= 46; head();
  C.days.forEach(d => {
    need(40);
    rect(L, y-5, R-L, 17, '0.945 0.945 0.945');
    text((dayName(d)+(d.date?'  -  '+d.date:'')).toUpperCase(), L+4, y, 8, true, '0.25 0.25 0.25');
    text(money(dayTotal(d)), COL.tot, y, 8.5, true, '0.25 0.25 0.25', 'r');
    y -= 19;
    if(!d.lines.length){ text('No items', COL.item, y, 9, false, '0.55 0.55 0.55'); y -= 16; }
    d.lines.forEach(l => {
      const {name, code, it} = lineInfo(l), p = linePrice(l);
      const nm = wrap(name + ((it&&it.lo==null&&l.price==null)?' (price needed)':''), 9.5, false, COL.qty - 40 - COL.item);
      need(nm.length*12 + 6);
      text(code||'', COL.code, y, 8, false, '0.4 0.4 0.4');
      nm.forEach((s, j) => text(s, COL.item, y - j*12, 9.5, false));
      text(String(l.qty), COL.qty, y, 9.5, false, null, 'r');
      text(money(p), COL.unit, y, 9.5, false, null, 'r');
      text(money(p*l.qty), COL.tot, y, 9.5, false, null, 'r');
      y -= nm.length*12 + 2; line(L, y+6, R, y+6, 0.4, '0.88 0.88 0.88'); y -= 8;
    });
  });
  // totals
  const rows = [];
  if(C.days.length>1) C.days.forEach(d => rows.push([dayName(d), money(dayTotal(d)), '0.4 0.4 0.4']));
  rows.push(['Subtotal', money(t.sub)]);
  if(t.disc>0) rows.push([`Discount (${t.pct}%)`, '-'+money(t.disc)]);
  need(rows.length*15 + 120);
  y -= 8; const X = 360;
  rows.forEach(([a, b, c]) => { text(a, X, y, 10, false, c); text(b, R, y, 10, false, c, 'r'); y -= 15; });
  line(X, y+9, R, y+9, 1.4, '0.1 0.1 0.1'); y -= 8;
  text('Case total', X, y, 13, true); text(money(t.total), R, y, 13, true, null, 'r'); y -= 15;
  if(t.ranged){ text('Estimate range', X, y, 8.5, false, '0.4 0.4 0.4'); text(money(t.lo)+' - '+money(t.hi), R, y, 8.5, false, '0.4 0.4 0.4', 'r'); y -= 12; }
  y -= 40; line(L, y, L+220, y, 0.7, '0.45 0.45 0.45'); line(R-220, y, R, y, 0.7, '0.45 0.45 0.45');
  text('Clinician signature', L, y-12, 9, false, '0.3 0.3 0.3'); text('Client acknowledgement', R-220, y-12, 9, false, '0.3 0.3 0.3');
  y -= 34; text('Simulation invoice for the Diagnostic Challenge course. Prices from WSU VTH price sheets; final charges may differ.', L, y, 7.5, false, '0.5 0.5 0.5');
  pages.push(ops.join('\n'));
  // assemble
  const objs = [];
  const add = s => { objs.push(s); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add(null);
  const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids = [];
  pages.forEach((c, i) => {
    c += `\nBT 0.55 0.55 0.55 rg /F1 7.5 Tf ${R - tw('Page '+(i+1)+' of '+pages.length,7.5)} 30 Td (Page ${i+1} of ${pages.length}) Tj ET`;
    const s = add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${s} 0 R >>`));
  });
  objs[1] = `<< /Type /Pages /Kids [${kids.map(k => k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out = '%PDF-1.4\n', offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10,'0')+' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([out], {type:'application/pdf'});
}
const fileBase = () => (C.f.case||'dc-case').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-') || 'dc-case';
$('#pdfBtn').addEventListener('click', async () => {
  if(!hasLines()) return toast('Add items first');
  const blob = buildPDF(), name = fileBase()+'-invoice.pdf';
  const mobile = window.matchMedia('(max-width:1060px)').matches;
  try{
    const file = new File([blob], name, {type:'application/pdf'});
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('PDF saved: '+name);
});

/* mobile bar */
function renderMbar(){
  const t = totals(), d = targetDay();
  const n = isFull() ? C.days.reduce((a,x) => a + x.lines.length, 0) : d.lines.length;
  $('#mInfo').textContent = isFull() ? `Full case \u00b7 ${C.days.length} day${C.days.length>1?'s':''} \u00b7 ${n} item${n===1?'':'s'}` : `${dayName(d)}: ${money(dayTotal(d))} \u00b7 ${n} item${n===1?'':'s'} \u00b7 case total`;
  $('#mTotal').textContent = money(t.total);
  $('#mToggle').textContent = document.body.classList.contains('m-inv') ? 'Add items' : 'View invoice';
}
$('#mToggle').addEventListener('click', () => { document.body.classList.toggle('m-inv'); window.scrollTo(0,0); renderMbar(); });
$('#caseTog').addEventListener('click', () => { document.body.classList.toggle('m-case'); $('#caseTog').textContent = document.body.classList.contains('m-case') ? 'Hide details' : 'Case details'; });
function bump(){ const m = $('#mbar'); m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump'); }

/* toast */
let tt, mt; function toast(m){
  if(window.matchMedia('(max-width:1060px)').matches){ const i = $('#mInfo'); i.textContent = m; i.style.color = 'var(--text)'; bump(); clearTimeout(mt); mt = setTimeout(() => { i.style.color = ''; renderMbar(); }, 1800); return; }
  const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200); }

/* init */
renderSide(); renderInvoice(); renderList();
})();
</script>
